name: links

# Daily incremental link check over data/links-cache.csv (no merge needed: the cache is the queue),
# plus an alert when the weekly build hasn't succeeded in 14 days.
on:
  schedule:
    - cron: "43 9 * * *"   # every day 09:43 UTC
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutos de checagem"
        default: "25"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: cardapios-dados-pipeline
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check links due today
        run: python -m cardapios_dados check-links --cache-only --budget-minutes "${{ inputs.budget_minutes || '25' }}" --workers 32

      - name: Commit cache
        run: |
          git config user.name "cardapios-dados[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/links-cache.csv
          if git diff --cached --quiet; then echo "Nada para commitar"; exit 0; fi
          git commit -m "dados: links $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

  stale-build:
    runs-on: ubuntu-latest
    steps:
      - name: Fail and open an issue if the last successful build is older than 14 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh run list --workflow build.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt')
          if [ -z "$last" ]; then echo "::warning::Nenhum build com sucesso ainda."; exit 0; fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Último build com sucesso: $last ($age dias)"
          if [ "$age" -le 14 ]; then exit 0; fi
          title="Build dos dados parado há mais de 14 dias"
          body="O último build com sucesso foi em $last ($age dias). Veja Actions > build. Lembrete: o GitHub desativa workflows agendados de repositórios públicos depois de 60 dias sem atividade."
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then gh issue create --title "$title" --body "$body"; fi
          exit 1
