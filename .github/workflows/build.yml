name: build

# Weekly full pipeline: sheet + Overture -> merge -> links -> repair -> publish (GitHub Pages).
# The cron minute is "odd" on purpose: GitHub delays or skips jobs scheduled at :00 under load.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC (03:17 in São Paulo)
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publicar mesmo se a trava de regressão disparar (queda > 20%)"
        type: boolean
        default: false
      link_budget_minutes:
        description: "Minutos para a checagem de links"
        default: "90"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Same group as links.yml: the two jobs never push the link cache at the same time.
concurrency:
  group: cardapios-dados-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch sheet
        run: python -m cardapios_dados fetch-sheet

      - name: Fetch Overture (latest release)
        run: python -m cardapios_dados fetch-overture --region sp-estado

      - name: Merge
        run: python -m cardapios_dados merge --region sp-estado

      - name: Check links (incremental, time-boxed)
        run: python -m cardapios_dados check-links --budget-minutes "${{ inputs.link_budget_minutes || '90' }}" --workers 32

      - name: Repair links
        run: python -m cardapios_dados repair-links --budget-minutes 25 --workers 32

      - name: Publish (regression guard)
        id: publish
        run: python -m cardapios_dados publish ${{ inputs.force_publish && '--force' || '' }}

      # Keep the link cache and ids even when publishing was refused: the work is not lost.
      - name: Commit caches, ids and report
        if: always() && steps.publish.conclusion != 'skipped'
        run: |
          git config user.name "cardapios-dados[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "Nada para commitar"; exit 0; fi
          git commit -m "dados: build $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Falha no build semanal dos dados"
          body="O workflow build falhou em $(date -u +%Y-%m-%d). Se foi a trava de regressão, veja reports/ultimo-build.md; para publicar mesmo assim, rode o workflow à mão com force_publish. Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
